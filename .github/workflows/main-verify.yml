name: Main Verify

# ci.yml triggers on `pull_request:` alone, so its test matrix runs against
# a branch at its own merge moment and never runs again once that branch
# lands on main - "main is green" was inferred from that, never checked
# post-merge. This is that check: it runs the SAME test job (the one whose
# real-world timing/OS/process behavior a PR's own run cannot fully
# corroborate for main, since main's state after a merge - and any drift
# in real-world conditions between the PR's run and the merge landing -
# is never re-verified) against main itself, after every push to it.
#
# HONEST SCOPE, stated here because it belongs where the mechanism is
# defined: this DETECTS a defect that already landed green; it does NOT
# PREVENT one from landing, and it does NOT catch an intermittent that
# happens to pass its own run here too. "Main is now TESTED, at the
# frequency this triggers" - not "main is now verified" in any stronger
# sense than that.
#
# Deliberately a SEPARATE workflow file, not a job added into ci.yml's
# `pull_request`-scoped jobs list: scripts/verify-workflow-topology.mjs
# statically requires ci.yml's aggregate `gate` job to depend on, and
# literally require success from, EVERY job in that file - so a job that
# only ever runs on push would show up "skipped" on every PR run and make
# `gate` red on every PR, not just on main. Keeping this in its own file
# means it never enters that computation at all, and it is never added to
# any required check - branch protection points only at `gate`.
#
# LOCKSTEP WARNING: the `test` job below is a DELIBERATE, DISCLOSED
# duplicate of ci.yml's own `test` job (same reasoning ci.yml's
# INDEPENDENT_EXPECTED_LEGS/INDEPENDENT_REQUIRED_JOB_IDS constants already
# accept elsewhere in this repo: an intentional, commented duplicate that a
# derivation could silently drift out of sync with is preferred here over
# a `workflow_call` refactor, since scripts/lint-workflow-jobs.mjs's matrix-
# completeness check reads `job.strategy.matrix` from the CALLING side of a
# job definition and would need its own rework to understand a matrix that
# instead lives inside a reusable workflow's callee file - not attempted
# here). test/main-verify-workflow.test.js asserts the two `test`
# jobs' matrices and step lists stay identical, so a drift here fails a
# test rather than failing silently.
on:
  push:
    branches:
      - main

permissions:
  contents: read # workflow-level default; only report-failure below grants itself issues: write, since it is the only job that needs it

concurrency:
  group: main-verify
  # Never cancel: a queued run must still execute against the merge that
  # queued it, so its result is attributable to that exact commit - a
  # cancelled run's failure would be lost or misattributed to whichever
  # merge happened to run next.
  cancel-in-progress: false

jobs:
  # LOCKSTEP with ci.yml's own `test` job - see this file's header comment.
  test:
    name: main-verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/run-tests.mjs --test-timeout=120000
        env:
          GHANTIKA_JUNIT: test-results.xml
      - name: annotate any failing tests from this leg
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          report_paths: test-results.xml
          annotate_only: true
          fail_on_parse_error: true
          require_tests: true

  # Attributable and human-visible: runs only when `test` genuinely
  # failed, and opens or updates ONE standing tracking issue naming the
  # exact merge commit and linking to this run - never a bare red check
  # nobody is watching. Reusing one issue (rather than filing a new one
  # per failure) keeps a flaky intermittent from spamming the tracker
  # while still recording every occurrence as its own comment.
  report-failure:
    name: report main failure
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # gh issue create --label fails outright if the label doesn't exist
      # on the repo yet (gh issue list with the same flag does not - it
      # returns an empty result, exit 0). Without this step the one time
      # this job needs to run - a real post-merge failure - the create
      # call would go red in Actions on that one call, visibly, not
      # silently; the run itself would still be red, but the human
      # tracking issue would never get filed. --force makes this
      # idempotent (create-or-update), so the label is provisioned here
      # rather than depending on it having been created out-of-band
      # beforehand.
      - name: ensure the main-verify-failure label exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create main-verify-failure --repo "$REPO" \
            --color d73a4a \
            --description "Main Verify detected a test failure on main after merge" \
            --force
      - name: open or update the main-verify tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY="Main Verify's test matrix failed on merge commit \`$SHA\`. Run: $RUN_URL

          This is a POST-MERGE detection, not a defect introduced by opening this issue - the failure was already on \`main\` before this ran. See the linked run for which matrix leg(s) failed and why."

          EXISTING=$(gh issue list --repo "$REPO" --label main-verify-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "Main Verify: test matrix failed on main" --label main-verify-failure --body "$BODY"
          fi
